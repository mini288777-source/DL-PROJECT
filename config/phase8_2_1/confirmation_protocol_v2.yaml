zero_support_policy:
  policy: "Classes with zero true instances in confirmation set reported as N/A for F1/Recall/Precision. Canonical 7-class Macro-F1 retains zero in numerator with fixed denominator=7."
  canonical_reference: "reports/FINAL_METRIC_DEFINITIONS.md#L75-L84"

evaluation_metric_definitions:
  primary_safety:
    metric: "False Emergency Rate (FER)"
    formula: "FP / (FP + TN)"
    bound: 0.1500
  primary_utility:
    metric: "End-to-End Emergency Recall"
    formula: "TP / (TP + FN)"
  secondary_utility:
    metric: "End-to-End Emergency Precision"
    formula: "TP / (TP + FP)"
  overall_classification:
    metric: "Canonical 7-Class Macro-F1"
    formula: "sum(F1_c) / 7.0"

statistical_testing_framework:
  sample_unit: "Utterance with speaker-clustered bootstrap standard errors"
  primary_comparisons:
    - comparison: "Track B (Quantum) vs Track A (Classical Baseline)"
      hypothesis: "Track B demonstrates superior Emergency Recall subject to FER <= 0.1500"
    - comparison: "Track B (Quantum) vs Track C (Matched Classical Shadow)"
      hypothesis: "Track B demonstrates quantum-specific advantage beyond parameter matching"
  multiplicity_correction: "Holm-Bonferroni step-down correction across primary hypotheses"
  alpha_level: 0.05
  power_planning_method: "Wilson score confidence width targeting FER margin of error <= 0.02 at 95% confidence level"

data_locking_contract:
  manifest_fingerprint_required: true
  sha256_verification_before_reading: true
  eval_execution: "Single-shot forward inference only. Zero fitting, tuning, calibration, PCA estimation, replay, or threshold modification on confirmation data."
  stopping_criteria:
    - "Provenance gap or missing session metadata"
    - "Detection of historical TORGO audio hashing matches"
    - "Emergency class support under 30 true positive events"
    - "Unmaterialized candidate checkpoint reference"
