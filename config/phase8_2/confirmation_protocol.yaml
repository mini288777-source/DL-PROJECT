canonical_taxonomy:
- GENERAL_SPEECH
- CRITICAL_RESPONSE
- FALL
- BREATHING_MEDICAL
- PAIN
- SOS_HELP
- LOCATION
zero_support_policy: Classes with zero true instances in confirmation set reported
  as N/A for F1/Recall/Precision. Canonical 7-class Macro-F1 retains zero in numerator
  with denominator=7.
safety_constraints:
  primary_safety_metric: False Emergency Rate (FER) = FP / (FP + TN)
  safety_bound_limit: 0.15
  enforcement_rule: Both pooled FER AND speaker-specific FER must not exceed 0.1500.
    A pooled FER <= 15% does not establish individual speaker compliance.
  post_hoc_threshold_adjustment: "STRICTLY_PROHIBITED \u2014 Thresholds are frozen\
    \ before confirmation evaluation."
statistical_testing_framework:
  sample_unit: Utterance with speaker-clustered bootstrap standard errors
  comparisons:
  - Track B (Quantum) vs Track A (Classical)
  - Track B (Quantum) vs Track C (Classical Shadow)
  multiplicity_correction: Holm-Bonferroni step-down correction across primary hypotheses
  alpha_level: 0.05
  power_planning_method: Wilson score confidence width targeting FER margin of error
    <= 0.02 at 95% confidence level
  required_sample_size: TO BE DETERMINED (formal prospective power calculation required
    prior to recruitment)
data_locking_contract:
  manifest_hash_verification: SHA-256 fingerprint required before reading
  eval_execution: Single-shot inference. Zero training, fine-tuning, or PCA recalibration
    permitted on confirmation data.
  stop_criteria:
  - Provenance gap or missing session metadata
  - Detection of historical TORGO audio hashing matches
  - Emergency class support under 30 true positive events
